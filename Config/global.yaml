pso:
  inertia: 0.7
  cognitive: 1.5
  social: 1.5

flash:
  duration: 2.0
  cooldown: 10.0
  trigger_dist: 10.0

environment:
  bounds: [100.0, 100.0, 100.0]

# --- LLM Providers (Pattern DagBot) ---
llm_providers:
  openrouter:
    display_name: "OpenRouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    default_model: "${LLM_MODEL:google/gemini-2.0-flash-exp:free}"
    icon: "globe"
    description: "Aggregator accessing many models (Google, Meta, Mistral, etc.)."
    recommended: true
    models:
      - "google/gemini-2.0-flash-exp:free"
      - "google/gemini-2.5-flash:free"
      - "qwen/qwen3-next-80b-a3b-instruct:free"
      - "z-ai/glm-4.5-air:free"
      - "meta-llama/llama-3.3-70b-instruct:free"
      - "deepseek/deepseek-chat-v3-0324:free"
      - "mistralai/mistral-small-3.1-24b-instruct:free"

  ollama:
    display_name: "Ollama (Local)"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: "ollama"
    default_model: "llama3"
    icon: "server"
    description: "Run LLMs locally. Requires Ollama installed."
    recommended: false
    models:
      - "llama3"
      - "mistral"
      - "gemma"
