# --- SonarQube Project Properties ---
# Configuration stricte pour le projet AquaSwarm
# S'aligne avec les principes Lean et la qualité décrite dans GEMINI.md

sonar.projectKey=EssaimDrones
sonar.projectName=AquaSwarm Command Center
sonar.projectVersion=1.0.0

# --- Structure Source ---
# On inclut le Backend Python et le Frontend React
sonar.sources=Code/Backend/underwater_swarm,Code/Backend/api,Code/Frontend/src

# --- Tests & Coverage ---
# Repertoires pour les tests (pour qu'ils ne soient pas analysés comme du code source)
sonar.tests=Test,Code/Frontend/src/components/__tests__,Code/Frontend/src/hooks/__tests__,Code/Frontend/src/pages/__tests__

# Fichiers de couverture (générés par pytest/coverage et vitest)
sonar.python.coverage.reportPaths=.coverage,coverage.xml
sonar.javascript.lcov.reportPaths=Code/Frontend/coverage/lcov.info

# --- Language & Linter configurations ---
# Python
sonar.python.version=3.9, 3.10, 3.11, 3.12
# Frontend
sonar.javascript.node.maxspace=4096

# --- Exclusions ---
# On exclut les éléments qui ne doivent pas impacter la Quality Gate
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/node_modules/**,**/dist/**,Code/Frontend/coverage/**,Code/Backend/.mypy_cache/**,Code/Backend/.pytest_cache/**,Code/Frontend_old/**,Docs/**,**/migrations/**

# On exclut l'analyse du code pour les tests (qui sont des `sonar.tests`)
sonar.test.exclusions=**/__pycache__/**,**/.venv/**,**/node_modules/**

# --- Quality Gate ---
# Pour simuler une Quality Gate "Strict", on renforce les métriques standards :
# (Ces paramètres sont souvent gérés côté serveur SonarQube, mais voici une base)
#
# Règles de nommage, duplication, vulnérabilités et complexité cognitive.
sonar.cpd.exclusions=Test/**, Code/Frontend/src/**/*.test.tsx

# Encodage par défaut
sonar.sourceEncoding=UTF-8
